services:
  signal-web-client:
    build: .
    image: signal-web-client
    container_name: signal-web-client
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Point at your existing signal-cli-rest-api instance.
      SIGNAL_API_URL: ${SIGNAL_API_URL:-http://10.0.1.197:8095}
      # Leave blank to use the first linked account the API reports.
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
      # Strongly recommended: this app can read and send all your messages.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Set when serving over HTTPS behind a reverse proxy.
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - signal-web-data:/data

volumes:
  signal-web-data:

# ---------------------------------------------------------------------------
# Running the whole stack (signal-cli-rest-api + this client) on one host?
# Uncomment below, drop the SIGNAL_API_URL override above, and link a device
# via http://localhost:8095/v1/qrcodelink?device_name=web-client
#
#   signal-cli-rest-api:
#     image: bbernhard/signal-cli-rest-api:latest
#     restart: unless-stopped
#     environment:
#       # json-rpc keeps signal-cli resident: messages arrive instantly and
#       # sends stop queueing behind the receive loop. Strongly preferred.
#       MODE: json-rpc
#     ports:
#       - "8095:8080"
#     volumes:
#       - signal-cli-config:/home/.local/share/signal-cli
#
# volumes:
#   signal-cli-config:
# ---------------------------------------------------------------------------
