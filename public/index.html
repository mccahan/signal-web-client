<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1b1c20" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Web">
<meta name="mobile-web-app-capable" content="yes">
<title>Signal Web</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-pane="list">

<!-- Login gate ---------------------------------------------------------- -->
<div id="login" class="login" hidden>
  <form class="login__card" id="login-form">
    <div class="login__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.3A10 10 0 1 0 12 2Z"/></svg>
    </div>
    <h1>Signal Web</h1>
    <p class="login__hint">This client is password protected.</p>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="btn btn--primary">Unlock</button>
    <p class="login__error" id="login-error" role="alert"></p>
  </form>
</div>

<!-- App ----------------------------------------------------------------- -->
<div id="app" class="app" hidden>

  <!-- Conversation list -->
  <aside class="sidebar" id="sidebar">
    <header class="sidebar__head">
      <div class="sidebar__title">
        <h1>Signal</h1>
        <span class="status-dot" id="status-dot" title="Connecting…"></span>
      </div>
      <div class="sidebar__actions">
        <button class="icon-btn" id="btn-new-chat" title="New conversation" aria-label="New conversation">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4h-2v3h-3v2h3v3h2V9h3V7h-3V4ZM4 5h9v2H6v10h12v-6h2v8H4V5Z"/></svg>
        </button>
      </div>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.5 10.9l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input type="search" id="search-input" placeholder="Search" autocomplete="off">
      <button class="search__clear" id="search-clear" hidden aria-label="Clear search">&times;</button>
    </div>

    <div class="conv-list" id="conv-list" role="list"></div>

    <footer class="sidebar__foot">
      <span id="account-label" class="muted"></span>
      <button class="link-btn" id="btn-logout" hidden>Sign out</button>
    </footer>
  </aside>

  <!-- Thread -->
  <main class="thread" id="thread">
    <div class="thread__empty" id="thread-empty">
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.3A10 10 0 1 0 12 2Z"/></svg>
      <p>Select a conversation</p>
    </div>

    <div class="thread__inner" id="thread-inner" hidden>
      <header class="thread__head">
        <button class="icon-btn thread__back" id="btn-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6 4.6-4.6Z"/></svg>
        </button>
        <div class="avatar" id="thread-avatar"></div>
        <div class="thread__who">
          <div class="thread__name" id="thread-name"></div>
          <div class="thread__sub" id="thread-sub"></div>
        </div>
        <button class="icon-btn thread__menu-btn" id="btn-thread-menu" aria-label="Conversation options" aria-haspopup="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
        </button>
      </header>

      <div class="messages" id="messages">
        <button class="load-more" id="load-more" hidden>Load earlier messages</button>
        <div id="message-list"></div>
        <div class="typing-row" id="typing-row" hidden>
          <div class="bubble bubble--in typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="scroll-down" id="scroll-down" hidden>
        <button class="icon-btn" aria-label="Jump to latest">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="m12 16-6-6 1.4-1.4L12 13.2l4.6-4.6L18 10l-6 6Z"/></svg>
        </button>
        <span class="scroll-down__badge" id="scroll-badge" hidden></span>
      </div>

      <div class="composer" id="composer">
        <div class="composer__reply" id="composer-reply" hidden>
          <div class="composer__reply-bar"></div>
          <div class="composer__reply-body">
            <div class="composer__reply-who" id="reply-who"></div>
            <div class="composer__reply-text" id="reply-text"></div>
          </div>
          <button class="icon-btn" id="reply-cancel" aria-label="Cancel reply">&times;</button>
        </div>

        <div class="composer__attachments" id="composer-attachments" hidden></div>

        <div class="composer__row">
          <button class="icon-btn" id="btn-attach" title="Attach" aria-label="Attach file">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 6v9.5a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V6H9v8.5a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v10.5a6 6 0 0 0 12 0V6h-1.5Z"/></svg>
          </button>
          <input type="file" id="file-input" multiple hidden>
          <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
          <button class="icon-btn icon-btn--send" id="btn-send" title="Send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21 23 12 2 3v7l15 2-15 2v7Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- New conversation dialog --------------------------------------------- -->
<dialog id="new-chat-dialog" class="dialog">
  <form method="dialog" class="dialog__card" id="new-chat-form">
    <h2>New conversation</h2>
    <label for="new-chat-recipient">Phone number</label>
    <input id="new-chat-recipient" placeholder="+1 303 555 0123" inputmode="tel" autocomplete="off">
    <p class="dialog__hint">International format. The number must be registered on Signal.</p>
    <p class="dialog__error" id="new-chat-error"></p>
    <div class="dialog__actions">
      <!-- Cancel is type=button so the primary action stays the form's default
           submit button and Enter starts the conversation. -->
      <button type="button" class="btn" id="new-chat-cancel">Cancel</button>
      <button value="ok" class="btn btn--primary" id="new-chat-go">Start</button>
    </div>
  </form>
</dialog>

<!-- Media lightbox ------------------------------------------------------- -->
<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
  <a class="lightbox__download" id="lightbox-download" download>Download</a>
  <div class="lightbox__stage" id="lightbox-stage"></div>
</div>

<!-- Conversation menu ----------------------------------------------------- -->
<div class="sheet" id="thread-menu" hidden>
  <div class="sheet__panel">
    <button class="sheet__item" data-act="mute">Mute notifications</button>
    <button class="sheet__item" data-act="refresh">Refresh contacts &amp; groups</button>
    <button class="sheet__item sheet__item--danger" data-act="leave">Leave group</button>
    <button class="sheet__item sheet__item--danger" data-act="delete-conversation">Delete conversation</button>
    <button class="sheet__item sheet__cancel" data-act="cancel">Cancel</button>
  </div>
</div>

<!-- Message action sheet -------------------------------------------------- -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__panel">
    <div class="sheet__reactions" id="sheet-reactions"></div>
    <button class="sheet__item" data-act="reply">Reply</button>
    <button class="sheet__item" data-act="copy">Copy text</button>
    <button class="sheet__item sheet__item--danger" data-act="delete-everyone">Delete for everyone</button>
    <button class="sheet__item sheet__item--danger" data-act="delete">Delete for me</button>
    <button class="sheet__item sheet__cancel" data-act="cancel">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
