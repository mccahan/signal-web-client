name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN — no secrets
      # to create or rotate.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # NAS hardware is a mix of Intel (Synology x86, most QNAP) and ARM
      # (Synology DS' ARM models, Raspberry Pi), so publish both. QEMU is only
      # needed for the architecture the runner isn't.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The runtime base is a moving tag, so prove the built image still works
      # before publishing it. Built for the runner's own architecture and loaded
      # locally, which is the only way to actually run it here.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: signal-web-client:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke test
        run: ./scripts/smoke-test.sh signal-web-client:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations add "unknown/unknown" entries to the manifest list that
          # some NAS Docker UIs (older Synology/QNAP builds) fail to parse.
          provenance: false
          sbom: false
